name: Build macOS App

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          flutter doctor -v

      # location currently requires CocoaPods on macOS,
      # so disable Flutter's SwiftPM migration for this build.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean Flutter project
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      # Remove any stale CocoaPods output from an earlier project state.
      - name: Clean CocoaPods
        run: |
          rm -rf macos/Pods
          rm -f macos/Podfile.lock

      # Generate CocoaPods support files, including:
      # Pods-Runner.release.xcconfig
      # Pods-Runner-frameworks-Release-input-files.xcfilelist
      # Pods-Runner-frameworks-Release-output-files.xcfilelist
      - name: Install CocoaPods dependencies
        working-directory: macos
        run: |
          pod install --repo-update

      # Useful diagnostics. These should all exist before Xcode builds.
      - name: Verify CocoaPods files
        run: |
          echo "=== Pods Runner support directory ==="
          ls -la "macos/Pods/Target Support Files/Pods-Runner"

          echo ""
          echo "=== Release xcconfig ==="
          cat "macos/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"

          echo ""
          echo "=== Flutter Release config ==="
          cat "macos/Flutter/Flutter-Release.xcconfig"

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS app
        shell: bash
        run: |
          set -e

          RELEASE_DIR="build/macos/Build/Products/Release"

          APP_PATH=$(find "$RELEASE_DIR" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found."
            echo "Release directory contents:"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "breath-state-macos.zip"

          ls -lh breath-state-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: breath-state-macos
          path: breath-state-macos.zip
          if-no-files-found: error
          retention-days: 7